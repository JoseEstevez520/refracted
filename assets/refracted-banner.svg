    <linearGradient id="prism" x1="560" y1="100" x2="820" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#DFF9FF" stop-opacity=".86"/><stop offset=".4" stop-color="#99B4FF" stop-opacity=".28"/><stop offset="1" stop-color="#D9A7FF" stop-opacity=".62"/></linearGradient>
